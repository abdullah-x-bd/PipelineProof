name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: pipelineproof doctor
      - run: python -m build
      - run: python -m venv /tmp/pipelineproof-wheel
      - run: /tmp/pipelineproof-wheel/bin/python -m pip install dist/*.whl
      - run: /tmp/pipelineproof-wheel/bin/pipelineproof doctor

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: docker build -f docker/task.Dockerfile -t pipelineproof-task:0.3.0 .
      - run: pipelineproof generate --output /tmp/pipelineproof-tasks
      - run: pipelineproof verify --task feature-schema-a --candidate controls/feature-schema-a/canonical --mode docker > /tmp/correct.json
      - run: pipelineproof verify --task feature-schema-a --candidate /tmp/pipelineproof-tasks/feature-schema-a --mode docker > /tmp/broken.json
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path

          correct = json.loads(Path("/tmp/correct.json").read_text())
          broken = json.loads(Path("/tmp/broken.json").read_text())
          assert correct["passed"] is True, correct
          assert broken["passed"] is False, broken
          PY

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -o addopts="-ra --strict-markers" -m slow
      - run: pipelineproof reproduce --output /tmp/pipelineproof-evidence --seeds 4 --mode local
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path

          hashes = json.loads(Path("/tmp/pipelineproof-evidence/release_hashes.json").read_text())
          forbidden = (".git/", ".venv/", "build/", "dist/", "pipelineproof.egg-info/")
          assert not [path for path in hashes if path.startswith(forbidden)], hashes
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pipelineproof-evidence
          path: /tmp/pipelineproof-evidence
          if-no-files-found: error
