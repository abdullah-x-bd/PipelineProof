name: CI

on:
  push:
  pull_request:

concurrency:
  group: pipelineproof-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: unit-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: pipelineproof doctor
      - run: python -m build
      - run: python -m venv /tmp/pipelineproof-wheel
      - run: /tmp/pipelineproof-wheel/bin/python -m pip install dist/*.whl
      - run: /tmp/pipelineproof-wheel/bin/pipelineproof doctor
      - run: /tmp/pipelineproof-wheel/bin/pipelineproof --version

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: docker build -f docker/task.Dockerfile -t pipelineproof-task:0.4.0 .
      - run: pipelineproof generate --output /tmp/pipelineproof-tasks
      - run: pipelineproof verify --task feature-schema-a --candidate controls/feature-schema-a/canonical --mode docker > /tmp/correct.json
      - run: pipelineproof verify --task feature-schema-a --candidate /tmp/pipelineproof-tasks/feature-schema-a --mode docker > /tmp/broken.json
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path

          correct = json.loads(Path("/tmp/correct.json").read_text())
          broken = json.loads(Path("/tmp/broken.json").read_text())
          assert correct["passed"] is True, correct
          assert broken["passed"] is False, broken
          PY

  evidence-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -o addopts="-ra --strict-markers" -m slow
      - run: pipelineproof reproduce --output /tmp/pipelineproof-evidence-local --seeds 4 --mode local
        env:
          PIPELINEPROOF_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pipelineproof evidence-manifest --input /tmp/pipelineproof-evidence-local
      - run: pipelineproof validate-evidence --input /tmp/pipelineproof-evidence-local --allow-local
      - uses: actions/upload-artifact@v4
        with:
          name: pipelineproof-evidence-local
          path: /tmp/pipelineproof-evidence-local
          if-no-files-found: error

  evidence-docker:
    name: canonical-docker-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: docker build -f docker/task.Dockerfile -t pipelineproof-task:0.4.0 .
      - run: pipelineproof reproduce --output /tmp/pipelineproof-evidence-docker --seeds 4 --mode docker
        env:
          PIPELINEPROOF_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record Docker image identity
        run: |
          IMAGE_ID="$(docker image inspect pipelineproof-task:0.4.0 --format '{{.Id}}')"
          python - "$IMAGE_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("/tmp/pipelineproof-evidence-docker/environment.json")
          payload = json.loads(path.read_text())
          payload["docker_image_id"] = sys.argv[1]
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
      - run: pipelineproof evidence-manifest --input /tmp/pipelineproof-evidence-docker
      - run: pipelineproof validate-evidence --input /tmp/pipelineproof-evidence-docker
      - uses: actions/upload-artifact@v4
        with:
          name: pipelineproof-evidence-docker
          path: /tmp/pipelineproof-evidence-docker
          if-no-files-found: error

  commit-evidence:
    name: persist-canonical-evidence
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: evidence-docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: pipelineproof-evidence-docker
          path: results/public/v0.4.0
      - name: Commit validated evidence if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/public/v0.4.0
          if git diff --cached --quiet; then
            echo "Canonical evidence already matches the validated artifact."
          else
            git commit -m "Record v0.4 canonical Docker evidence [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
