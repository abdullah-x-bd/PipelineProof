name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: pipelineproof doctor
      - run: python -m build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: docker build -f docker/task.Dockerfile -t pipelineproof-task:0.3.0 .
      - run: pipelineproof generate --output /tmp/pipelineproof-tasks
      - run: pipelineproof verify --task feature-schema-a --candidate controls/feature-schema-a/canonical --mode docker > /tmp/correct.json
      - run: pipelineproof verify --task feature-schema-a --candidate /tmp/pipelineproof-tasks/feature-schema-a --mode docker > /tmp/broken.json
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path

          correct = json.loads(Path("/tmp/correct.json").read_text())
          broken = json.loads(Path("/tmp/broken.json").read_text())
          assert correct["passed"] is True, correct
          assert broken["passed"] is False, broken
          PY

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-attack-battery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -o addopts="-ra --strict-markers" -m slow
      - run: pipelineproof reproduce --output /tmp/reproduced --seeds 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduced-public-evidence
          path: /tmp/reproduced
      - name: Commit audited evidence
        run: |
          cp /tmp/reproduced/*.json results/public/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/public
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate audited public evidence"
            git push
          fi
      - name: Check committed evidence
        run: |
          for file in \
            task_catalog.json \
            soundness_receipt.json \
            reward_ladder.json \
            family_controls.json \
            stability.json \
            candidate_search.json \
            sandbox_manifest.json \
            summary.json \
            release_hashes.json
          do
            diff -u "results/public/$file" "/tmp/reproduced/$file"
          done
