name: Regenerate deterministic evidence

on:
  push:
    branches: [agent/final-validation]

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Regenerate fixtures and evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from pipelineproof.catalog import get_task
          from pipelineproof.templates import task_files

          spec = get_task("feature-schema-a")
          files = task_files(spec, "canonical")
          root = Path("controls/feature-schema-a/canonical")
          for relative in ("data/example_train.json", "data/example_eval.json"):
              (root / relative).write_text(files[relative], encoding="utf-8")
          PY
          rm -rf results/public
          pipelineproof reproduce --output results/public --seeds 4 --mode local
          rm -f .release-trigger .github/workflows/regenerate-evidence.yml
      - name: Commit regenerated release evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate deterministic release evidence"
          git push origin HEAD:agent/final-validation
