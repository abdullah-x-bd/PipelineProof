name: Materialize release

on:
  push:
    branches:
      - agent/complete-zero-cost-release
    paths:
      - release/chunks/**
      - .github/workflows/materialize-release.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract
        shell: bash
        run: |
          set -euo pipefail
          cat release/chunks/part*.b64 | base64 --decode > /tmp/pipelineproof.tar.xz
          echo "f8114da76fe0641c898f7e8ebfbb3c6c6fee109d244927aa18bf5596ecff158e  /tmp/pipelineproof.tar.xz" | sha256sum --check
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name release -exec rm -rf {} +
          tar -xJf /tmp/pipelineproof.tar.xz -C .
          rm -rf release
      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete zero-cost PipelineProof release"
          git push origin HEAD:agent/complete-zero-cost-release
