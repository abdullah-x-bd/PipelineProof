name: Commit reproduced evidence

on:
  push:
    branches: [agent/harden-attack-battery]

permissions:
  contents: write

jobs:
  commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-attack-battery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pipelineproof reproduce --output results/public --seeds 4
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/public
          git commit -m "Regenerate audited public evidence"
          git push
