name: Materialize staged release

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  materialize:
    if: >-
      (github.event_name == 'issues' && github.event.issue.title == '[materialize PipelineProof release]') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/complete-zero-cost-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-zero-cost-release
          fetch-depth: 0
      - name: Verify and extract
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d release/chunks ]; then
            exit 0
          fi
          cat release/chunks/part*.b64 | base64 --decode > /tmp/pipelineproof.tar.xz
          echo "f8114da76fe0641c898f7e8ebfbb3c6c6fee109d244927aa18bf5596ecff158e  /tmp/pipelineproof.tar.xz" | sha256sum --check
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name release -exec rm -rf {} +
          tar -xJf /tmp/pipelineproof.tar.xz -C .
          rm -rf release
      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete zero-cost PipelineProof release"
          git push origin HEAD:agent/complete-zero-cost-release
