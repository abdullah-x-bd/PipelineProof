name: Apply final release

on:
  push:
    branches: [agent/final-zero-cost-release]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-zero-cost-release
          fetch-depth: 0
      - name: Apply release tree
        run: |
          git fetch origin agent/complete-zero-cost-release
          git rm -r .
          git archive origin/agent/complete-zero-cost-release | tar -x
          rm -f .github/workflows/apply-final-release.yml
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply complete zero-cost release to current main"
          git push origin HEAD:agent/final-zero-cost-release
