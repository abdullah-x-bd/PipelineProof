[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelineproof"
dynamic = ["version"]
description = "Execution-based benchmark and RL environment for silent ML pipeline integrity failures"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Abdullah X"}]
keywords = ["machine-learning", "benchmark", "agents", "reinforcement-learning", "ml-safety"]
dependencies = ["numpy>=1.26"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/abdullah-x-bd/PipelineProof"
Repository = "https://github.com/abdullah-x-bd/PipelineProof"
Issues = "https://github.com/abdullah-x-bd/PipelineProof/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11"
]

[project.scripts]
pipelineproof = "pipelineproof.cli:main"

[tool.setuptools.dynamic]
version = {attr = "pipelineproof._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: full environment evidence"]
norecursedirs = ["tasks", "controls", "attacks", "results", "dist", "build"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
