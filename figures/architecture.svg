<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PipelineProof benchmark architecture</title>
  <desc id="desc">A broken machine-learning repository is repaired by an agent and evaluated by a trusted verifier using public, functional, causal, persistence, interface, and protected-surface checks before a reward and diagnosis are emitted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111">PipelineProof execution architecture</text>
  <text x="600" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#444">Public repository repair with held-back behavioural verification</text>

  <rect x="55" y="210" width="205" height="115" rx="10" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="158" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Broken ML</text>
  <text x="158" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">repository</text>
  <text x="158" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">silent integrity defect</text>

  <line x1="260" y1="267" x2="330" y2="267" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="340" y="210" width="180" height="115" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="430" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700">Agent</text>
  <text x="430" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#444">edits src/**</text>
  <text x="430" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#444">candidate repair</text>

  <line x1="520" y1="267" x2="590" y2="267" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="600" y="125" width="365" height="300" rx="12" fill="#f7f7f7" stroke="#111" stroke-width="2.5"/>
  <text x="782" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700">Trusted verifier</text>
  <line x1="625" y1="178" x2="940" y2="178" stroke="#aaa"/>

  <g font-family="Arial, sans-serif" font-size="16" fill="#111">
    <rect x="635" y="196" width="140" height="45" rx="6" fill="#fff" stroke="#555"/><text x="705" y="224" text-anchor="middle">Interface</text>
    <rect x="790" y="196" width="140" height="45" rx="6" fill="#fff" stroke="#555"/><text x="860" y="224" text-anchor="middle">Public tests</text>
    <rect x="635" y="257" width="140" height="45" rx="6" fill="#fff" stroke="#555"/><text x="705" y="285" text-anchor="middle">Functional</text>
    <rect x="790" y="257" width="140" height="45" rx="6" fill="#fff" stroke="#555"/><text x="860" y="285" text-anchor="middle">Causal</text>
    <rect x="635" y="318" width="140" height="45" rx="6" fill="#fff" stroke="#555"/><text x="705" y="346" text-anchor="middle">Persistence</text>
    <rect x="790" y="318" width="140" height="45" rx="6" fill="#fff" stroke="#555"/><text x="860" y="346" text-anchor="middle">Protected</text>
  </g>
  <text x="782" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">hidden generated probes • private seeds • independent metrics</text>

  <line x1="965" y1="267" x2="1020" y2="267" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1030" y="210" width="125" height="115" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1092" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700">Reward</text>
  <text x="1092" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">+ diagnosis</text>
  <text x="1092" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">pass iff all checks</text>

  <rect x="340" y="470" width="625" height="85" rx="10" fill="#fff" stroke="#777" stroke-dasharray="7 5"/>
  <text x="652" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700">Scored execution boundary</text>
  <text x="652" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#444">Docker canonical • candidate mount read-only • network disabled • resource limits • trusted verifier outside candidate process</text>
</svg>